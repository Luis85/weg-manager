# Release on a bare semver tag (no "v"). Two jobs, so that the job with write permissions never runs
# repository code:
#
#   build    read-only token, no persisted credentials. Checks that the tagged commit is on main,
#            installs (dependency install scripts run here), runs the gate and the real-Obsidian e2e
#            suite (the gate includes check:notices, so THIRD-PARTY-NOTICES.txt is current), stages
#            main.js, manifest.json and styles.css in release/weg-manager/ and the notices file
#            beside that folder (`release:package` re-runs check:dist and checks versions.json) and
#            uploads release/ as an artifact.
#   release  write permissions, no checkout and no npm. Downloads that artifact, attests the four
#            files (the signed build-provenance attestation the Obsidian developer docs recommend,
#            "Release your plugin with GitHub Actions") and creates the GitHub release with exactly
#            those files. Obsidian and BRAT install only the first three; the notices file is for
#            people who read the licences. A 0.x release is a pre-release (BRAT).
#
# Never run so far; see docs/engineering/releasing.md.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Full history, so that the tagged commit can be compared with main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tagged commit must be on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error title=Tag not on main::Tag $TAG ($(git rev-parse --short HEAD)) is not an ancestor of origin/main. Release from main only."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      # The same end-to-end setup as ci.yml (job e2e): latest Obsidian under Xvfb, kept in the cache.
      - name: Resolve Obsidian versions for the cache key
        run: |
          node tests/e2e/wdio.conf.mts | grep 'obsidian-cache-key:' > obsidian-versions-lock.txt
          cat obsidian-versions-lock.txt
          rm -rf .obsidian-cache
      - name: Cache Obsidian
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ runner.os }}-${{ hashFiles('obsidian-versions-lock.txt') }}
      - name: Start a virtual display and window manager
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y herbstluftwm
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1280x1024x24 +extension GLX -noreset &
          sleep 1
          DISPLAY=:99 herbstluftwm &
          sleep 1
      - run: npm run test:e2e
        env:
          WDIO_MAX_INSTANCES: 2
      - name: Stage the release files
        env:
          TAG: ${{ github.ref_name }}
        run: npm run release:package -- --tag "$TAG"
      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error
      - name: Upload e2e logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: reports/e2e/
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/weg-manager/main.js
            release/weg-manager/manifest.json
            release/weg-manager/styles.css
            release/THIRD-PARTY-NOTICES.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          # Major version 0 is a pre-release, so it reaches BRAT testers without being "Latest".
          if [ "${TAG%%.*}" = "0" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" --verify-tag --title "$TAG" --generate-notes \
            release/weg-manager/main.js release/weg-manager/manifest.json release/weg-manager/styles.css \
            release/THIRD-PARTY-NOTICES.txt
