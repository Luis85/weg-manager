# Release a version (bare semver, no "v"). Two ways to start it:
#
#   by hand  "Run workflow" on main with the version (workflow_dispatch). This is the way for an
#            agent or anyone who cannot push tags: the workflow creates the tag on the commit it
#            built, together with the release. The version must be the one in manifest.json on main
#            and must not have a tag yet.
#   by tag   push a tag x.y.z that is on main.
#
# Two jobs, so that the job with write permissions never runs repository code:
#
#   build    read-only token, no persisted credentials. Resolves and checks the version first (the
#            commit is on main, the tag equals the manifest version, package.json and manifest.json
#            agree, versions.json has the entry: scripts/release-version.mjs and check-versions.mjs),
#            then installs (dependency install scripts run here), runs the gate (it includes
#            check:notices, so THIRD-PARTY-NOTICES.txt is current), stages main.js, manifest.json and
#            styles.css in release/weg-manager/ and the notices file beside that folder
#            (`release:package` re-runs check:dist and the versions check) and records their hashes.
#            Only then it runs the real-Obsidian e2e suite, which rebuilds dist/ and starts cached
#            binaries, checks that the staged files still match the hashes, and uploads release/ as an
#            artifact.
#   release  write permissions, no checkout and no npm. Downloads that artifact, attests the four
#            files (the signed build-provenance attestation the Obsidian developer docs recommend,
#            "Release your plugin with GitHub Actions") and creates the GitHub release with exactly
#            those files. Obsidian and BRAT install only the first three; the notices file is for
#            people who read the licences. A 0.x release is a pre-release (BRAT). Started by hand,
#            it creates the tag on the built commit; a tag the release creates starts no second run.
#
# First run: 0.2.0, started by hand. The start by a pushed tag has not run yet; see
# docs/engineering/releasing.md.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, bare x.y.z; must equal the version in manifest.json on main"
        required: true
        type: string

permissions:
  contents: read

# One release at a time; a second start waits instead of racing for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # Full history, so that the commit can be compared with main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Node first: the checks below are plain scripts of this repository that need no install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The version comes from the tag, or from the input of a start by hand. An input is only ever
      # read from the environment, never pasted into a script. scripts/release-version.mjs holds the
      # rules (tested in tests/unit/scripts/release-version.test.ts).
      - name: Resolve the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: node scripts/release-version.mjs
      - name: The commit must be on main
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error title=Not on main::$TAG ($(git rev-parse --short HEAD)) is not an ancestor of origin/main. Release from main only."
            exit 1
          fi
      # The cheap checks first, before the install and the 20 to 30 minutes of gate and e2e: the tag
      # equals the manifest version, package.json and manifest.json agree, versions.json has the entry.
      - name: Check the versions
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: node scripts/check-versions.mjs --tag "$TAG"
      - run: npm ci
      - run: npm run verify
      # Stage and hash what the gate built (it ends with build, check:dist and check:notices on
      # dist/) before anything else runs: the e2e steps below start cached Obsidian and chromedriver
      # binaries and rebuild dist/. release:package re-runs check:dist and the versions check.
      - name: Stage the release files
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: npm run release:package -- --tag "$TAG"
      - name: Record the hashes of the staged files
        run: |
          cd release
          sha256sum weg-manager/main.js weg-manager/manifest.json weg-manager/styles.css THIRD-PARTY-NOTICES.txt | tee "$RUNNER_TEMP/release-files.sha256"
      # The same end-to-end setup as ci.yml (job e2e): latest Obsidian under Xvfb, kept in the cache.
      - name: Resolve Obsidian versions for the cache key
        run: |
          node tests/e2e/wdio.conf.mts | grep 'obsidian-cache-key:' > obsidian-versions-lock.txt
          cat obsidian-versions-lock.txt
          rm -rf .obsidian-cache
      # The download is restored here and saved after the run (below), so that a run whose tests
      # fail still keeps it for the retry. A cache entry never changes, so a hit is not saved again.
      - name: Restore Obsidian
        id: obsidian-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ runner.os }}-${{ hashFiles('obsidian-versions-lock.txt') }}
      # xvfb-run is on the runner image (package xvfb, Ubuntu 24.04 and 26.04), so nothing is
      # installed. No window manager: docs/engineering/github-setup.md, "The e2e display and the
      # Obsidian cache", says what to watch for and how to put it back.
      - name: End-to-end tests under a virtual display
        run: xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX -noreset" npm run test:e2e
        env:
          WDIO_MAX_INSTANCES: 2
      # Obsidian is downloaded as app, installer and chromedriver, each into its own folder once
      # complete. Save only when all three are there, because an entry that lacks one would be
      # restored by every later run, and could not be replaced.
      - name: Check that the Obsidian download is complete
        id: obsidian-download
        if: ${{ always() && steps.obsidian-cache.outputs.cache-hit != 'true' }}
        run: |
          if compgen -G ".obsidian-cache/obsidian-app/*.asar" > /dev/null \
            && compgen -G ".obsidian-cache/obsidian-installer/*/Obsidian-*" > /dev/null \
            && compgen -G ".obsidian-cache/electron-chromedriver/*/*" > /dev/null; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Obsidian download::.obsidian-cache is incomplete, so it is not saved."
          fi
      - name: Save Obsidian
        if: ${{ always() && steps.obsidian-cache.outputs.cache-hit != 'true' && steps.obsidian-download.outputs.complete == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .obsidian-cache
          key: ${{ steps.obsidian-cache.outputs.cache-primary-key }}
      # The e2e run rebuilt dist/ and ran cached binaries. What is uploaded must still be what the
      # gate built, so the staged files must match the hashes taken at staging time.
      - name: The staged files are unchanged
        run: |
          cd release
          sha256sum --check --strict "$RUNNER_TEMP/release-files.sha256"
      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error
      - name: Upload e2e logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: reports/e2e/
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/weg-manager/main.js
            release/weg-manager/manifest.json
            release/weg-manager/styles.css
            release/THIRD-PARTY-NOTICES.txt
      - name: Create GitHub release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          flags=()
          # Major version 0 is a pre-release, so it reaches BRAT testers without being "Latest".
          if [ "${TAG%%.*}" = "0" ]; then flags+=(--prerelease); fi
          # Started by hand, the release creates the tag on the commit the build job built, so the
          # tag must not exist: with an existing tag `gh` would ignore --target. Started by a tag,
          # that tag must exist.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Only a 404 means "no such tag". Any other failure (5xx, rate limit, network) says
            # nothing about the tag, so the job fails instead of going on with --target.
            if lookup=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" 2>&1); then
              echo "::error title=Tag exists::Tag $TAG already exists. A version is released once; bump the version for a new release."
              exit 1
            elif ! grep -q "HTTP 404" <<< "$lookup"; then
              echo "::error title=Tag lookup failed::Could not tell whether tag $TAG exists: $lookup"
              exit 1
            fi
            flags+=(--target "$SHA")
          else
            flags+=(--verify-tag)
          fi
          gh release create "$TAG" "${flags[@]}" --title "$TAG" --generate-notes \
            release/weg-manager/main.js release/weg-manager/manifest.json release/weg-manager/styles.css \
            release/THIRD-PARTY-NOTICES.txt
