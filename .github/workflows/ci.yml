# Quality gate on every push to main and every pull request. The logic lives in npm scripts;
# this file only orchestrates them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only a pull request's older run is stale. Two merges to main in a row must each finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            reports/junit.xml
            reports/coverage/cobertura-coverage.xml
          if-no-files-found: ignore
      - name: Upload plugin build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: dist/
      # Approximates the community directory's source scan (docs/engineering/testing.md).
      # Informational: findings are visible in the log but never fail the job or the workflow
      # (owner's decision, 2026-11-21). A step of this job, not a job of its own, so that it shares
      # the install; it comes last, so that the reports and the build are uploaded first.
      # Step-level continue-on-error keeps the job (and the PR check) green; the annotation below
      # and the step log show the findings.
      - id: scan
        if: ${{ !cancelled() }}
        run: npm run lint:scanner
        continue-on-error: true
      - if: ${{ !cancelled() && steps.scan.outcome == 'failure' }}
        run: echo "::warning title=Scanner lint::Findings in the community-scan approximation (known - .claude/skills/archify/explainer/reader.js). See the 'npm run lint:scanner' step log and docs/engineering/testing.md."

  # End-to-end tests in a real Obsidian app (wdio-obsidian-service). Runs beside verify and is
  # not part of the fast gate. The downloaded Obsidian stays in the Actions cache only: it is
  # never uploaded as an artifact (Obsidian's terms forbid redistribution).
  # Latest Obsidian app on the latest installer only (owner's decision, 2026-11-21).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Resolve Obsidian versions for the cache key
        run: |
          node tests/e2e/wdio.conf.mts | grep 'obsidian-cache-key:' > obsidian-versions-lock.txt
          cat obsidian-versions-lock.txt
          rm -rf .obsidian-cache
      # The download is restored here and saved after the run (below), so that a run whose tests
      # fail still keeps it for the retry. A cache entry never changes, so a hit is not saved again.
      - name: Restore Obsidian
        id: obsidian-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ runner.os }}-${{ hashFiles('obsidian-versions-lock.txt') }}
      # xvfb-run is on the runner image (package xvfb, Ubuntu 24.04 and 26.04), so nothing is
      # installed. No window manager: docs/engineering/github-setup.md, "The e2e display and the
      # Obsidian cache", says what to watch for and how to put it back.
      - name: End-to-end tests under a virtual display
        run: xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX -noreset" npm run test:e2e
        env:
          WDIO_MAX_INSTANCES: 2
      # Obsidian is downloaded as app, installer and chromedriver, each into its own folder once
      # complete. Save only when all three are there, because an entry that lacks one would be
      # restored by every later run, and could not be replaced.
      - name: Check that the Obsidian download is complete
        id: obsidian-download
        if: ${{ always() && steps.obsidian-cache.outputs.cache-hit != 'true' }}
        run: |
          if compgen -G ".obsidian-cache/obsidian-app/*.asar" > /dev/null \
            && compgen -G ".obsidian-cache/obsidian-installer/*/Obsidian-*" > /dev/null \
            && compgen -G ".obsidian-cache/electron-chromedriver/*/*" > /dev/null; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Obsidian download::.obsidian-cache is incomplete, so it is not saved."
          fi
      - name: Save Obsidian
        if: ${{ always() && steps.obsidian-cache.outputs.cache-hit != 'true' && steps.obsidian-download.outputs.complete == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .obsidian-cache
          key: ${{ steps.obsidian-cache.outputs.cache-primary-key }}
      - name: Upload e2e logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: reports/e2e/
          if-no-files-found: ignore

  # Claude skill weg-gmail-to-vault: unit tests, then the distributable ZIP (not committed; see
  # docs/decisions/K-16). Independent of the plugin jobs.
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s skills/tests
      - run: python3 skills/package_claude_skills.py
      - name: Upload skill package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-skills
          path: skills/dist/*.zip
          if-no-files-found: error
