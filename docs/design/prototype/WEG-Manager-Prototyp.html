<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WEG Manager Prototyp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: Prototypleiste oben; darunter App-Rahmen wie im Obsidian-Tab. Ab 860px Sidebar, darunter mobiles Layout mit Segmentnavigation und Erfassen-Button. */
:root{
  --bg:#F6F6F3;--surface:#FFFFFF;--surface2:#FAFAF8;--sunk:#EDEDE8;--line:#E4E4DF;--line2:#D4D4D8;
  --fg:#18181B;--fg2:#52525B;--fg3:#5F5F67;--primary:#18181B;--on:#FFFFFF;--accent:#2563EB;
  --aw:#0F766E;--awbg:#E3F3EF;--awfg:#0B5F55;--tg:#6D28D9;--tgbg:#F1EBFE;--tgfg:#5B21B6;
  --warn:#B45309;--warnbg:#FEF3E2;--warnfg:#92400E;--bad:#B42318;--badbg:#FDECEA;--badfg:#9F1D14;
  --ok:#15803D;--okbg:#ECFDF3;--okfg:#166534;--info:#4F46E5;--infobg:#EEF2FF;--infofg:#3730A3;
  --judge:#6D28D9;--judgebg:#F5F3FF;--judgefg:#5B21B6;--mark:#FEF9C3;--scrim:rgba(24,24,27,.45);--pbar:#E7E7E3;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111113;--surface:#1A1A1D;--surface2:#1F1F22;--sunk:#232327;--line:#2C2C30;--line2:#3A3A3F;
  --fg:#EDEDEF;--fg2:#A1A1AA;--fg3:#9A9AA3;--primary:#EDEDEF;--on:#18181B;--accent:#60A5FA;
  --aw:#2BB3A3;--awbg:#0F2E2A;--awfg:#5EEAD4;--tg:#A78BFA;--tgbg:#2A1F45;--tgfg:#C4B5FD;
  --warn:#F59E0B;--warnbg:#3A2A12;--warnfg:#FCD34D;--bad:#F87171;--badbg:#3B1A1A;--badfg:#FCA5A5;
  --ok:#22C55E;--okbg:#11291C;--okfg:#86EFAC;--info:#818CF8;--infobg:#1E1B4B;--infofg:#A5B4FC;
  --judge:#A78BFA;--judgebg:#2A1F45;--judgefg:#C4B5FD;--mark:#4A3F0B;--scrim:rgba(0,0,0,.6);--pbar:#0B0B0C;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111113;--surface:#1A1A1D;--surface2:#1F1F22;--sunk:#232327;--line:#2C2C30;--line2:#3A3A3F;
  --fg:#EDEDEF;--fg2:#A1A1AA;--fg3:#9A9AA3;--primary:#EDEDEF;--on:#18181B;--accent:#60A5FA;
  --aw:#2BB3A3;--awbg:#0F2E2A;--awfg:#5EEAD4;--tg:#A78BFA;--tgbg:#2A1F45;--tgfg:#C4B5FD;
  --warn:#F59E0B;--warnbg:#3A2A12;--warnfg:#FCD34D;--bad:#F87171;--badbg:#3B1A1A;--badfg:#FCA5A5;
  --ok:#22C55E;--okbg:#11291C;--okfg:#86EFAC;--info:#818CF8;--infobg:#1E1B4B;--infofg:#A5B4FC;
  --judge:#A78BFA;--judgebg:#2A1F45;--judgefg:#C4B5FD;--mark:#4A3F0B;--scrim:rgba(0,0,0,.6);--pbar:#0B0B0C;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--fg2)}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:21px;padding:0 6px;border-radius:5px;font-size:11px;font-weight:600;color:var(--on);flex-shrink:0}
.b-AW{background:var(--aw)}.b-TG{background:var(--tg)}.b-A14{background:#1D4ED8}.b-BH{background:#9A3412}.b-LS{background:#475569}.b-PN{background:#0E7490}
select[data-on="true"]{border:1.5px solid var(--fg)!important;font-weight:600}
.ftag{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 4px 0 6px;border-radius:999px;background:var(--surface);border:1.5px solid var(--fg);font-size:13px;font-weight:600}
.ftag button{width:26px;height:26px;border:0;border-radius:50%;background:var(--sunk);display:inline-flex;align-items:center;justify-content:center;color:var(--fg)}
.cpick{display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--surface)}
.cpick button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;font-size:14px}
.cpick button[aria-checked="true"]{background:var(--sunk);font-weight:600}
.cpick .sub{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);padding:8px 12px 4px;border-top:1px solid var(--line)}
.filebox{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--surface2)}.b-none{background:transparent;border:1px dashed var(--line2);color:var(--fg2)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.c-bad{background:var(--badbg);color:var(--badfg)}.c-warn{background:var(--warnbg);color:var(--warnfg)}.c-info{background:var(--infobg);color:var(--infofg)}
.c-ok{background:var(--okbg);color:var(--okfg)}.c-n{background:var(--sunk);color:var(--fg)}.c-judge{background:var(--judgebg);color:var(--judgefg)}
.pid{font-family:var(--mono);font-size:12px;color:var(--fg3)}
.btn{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-weight:500;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on);font-weight:600}
.btn.pri:hover{opacity:.92}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--on);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:34px;padding:0 11px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .fl{font-size:13px;font-weight:600}
.inp{min-height:42px;padding:0 12px;border:1px solid var(--line2);border-radius:9px;background:var(--surface);width:100%}
textarea.inp{padding:10px 12px;min-height:84px;resize:vertical;line-height:1.5}
.seg{display:flex;flex-wrap:wrap;gap:3px;padding:3px;border-radius:10px;background:var(--sunk)}
.seg button{flex:1 1 auto;min-height:38px;padding:0 12px;border:0;border-radius:8px;background:transparent;font-size:13px;font-weight:500;color:var(--fg2);white-space:nowrap}
@media (hover:hover){
.seg button:not([aria-pressed="true"]):not(:disabled):hover{background:color-mix(in srgb,var(--surface) 55%,transparent);color:var(--fg)}
.kpi:hover,.msg:hover,.opt:hover{border-color:var(--line2);background:var(--surface2)}
.opt[aria-checked="true"]:hover{border-color:var(--fg)}
.tabs button:not([aria-selected="true"]):hover{background:var(--sunk);color:var(--fg)}
.cpick button:not([aria-checked="true"]):hover{background:var(--surface2)}
.ftag button:hover{background:var(--line2)}
.kpi,.msg,.opt,.seg button,.tabs button,.cpick button{transition:background-color .12s,border-color .12s,color .12s}
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1),0 0 0 1px var(--line)}

/* Kontakte */
.klist{display:flex;flex-direction:column;gap:12px}
.av{width:36px;height:36px;border-radius:50%;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;color:var(--fg2)}
.av.org{border-radius:9px}.av.lst{border-radius:9px;background:var(--infobg);color:var(--infofg)}
.av.lg{width:52px;height:52px;font-size:18px}
.row[aria-current="true"]{background:var(--sunk)}
.row.off .tx{color:var(--fg2)}
.kv{display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:14px}
.kv>span:nth-child(3n+1){color:var(--fg2);font-size:13px}
.kv>*{min-height:34px;display:flex;align-items:center;min-width:0;overflow-wrap:anywhere}
.lnk{border:0;background:none;padding:0;color:inherit;font:inherit;font-weight:inherit;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px;text-align:left;cursor:pointer}
.lnk:hover{text-decoration-color:currentColor}
.rolerow{display:flex;gap:8px;align-items:center}
.scrim.center{align-items:center;justify-content:center;padding:24px}
.sheet.dlg{width:min(620px,100%);height:auto;max-height:calc(100vh - 48px);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.kcall{display:flex;gap:8px;flex-wrap:wrap}.kcall .btn{flex:1 1 140px}
.kgrp{display:flex;align-items:center;gap:10px;padding:14px 16px 6px;border-top:1px solid var(--line)}
.kgrp:first-child{border-top:0}
.kgrp .lab{flex:1}
.krow{display:flex;align-items:center;border-top:1px solid var(--line)}
.kgrp+.krow{border-top:0}
.kmain{flex:1;min-width:0;display:flex;gap:12px;align-items:center;min-height:58px;padding:9px 8px 9px 16px;border:0;background:transparent;text-align:left;color:var(--fg)}
.krow:hover{background:var(--surface2)}
.krow.off .kmain{color:var(--fg2)}
.krow[aria-current="true"]{background:var(--sunk)}
.kacts{display:flex;gap:2px;padding-right:8px}
.kacts .iconbtn{width:40px;height:40px;color:var(--fg2)}
.ctog{min-width:180px;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:1.5px solid var(--line2);border-radius:10px;background:var(--surface);font-size:14px;font-weight:500;flex:0 0 auto}
.ctog[aria-checked="true"]{border-color:var(--fg);background:var(--sunk)}
.ctog .cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line2);display:inline-flex;align-items:center;justify-content:center}
.ctog[aria-checked="true"] .cb{background:var(--fg);border-color:var(--fg);color:var(--on)}
.err{color:var(--badfg);font-size:13px;font-weight:500}
.inp[aria-invalid="true"]{border-color:var(--bad)}
.dupe{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;font-size:13px;padding:8px 10px;border-radius:9px;background:var(--warnbg);color:var(--warnfg)}
.klist .feed>.row:first-child{border-top:0}
/* Einstellungen */
.ewrap{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.esub{flex:1 1 200px;max-width:240px;display:flex;flex-direction:column;gap:2px}
.econt{flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:16px;max-width:820px}
.inp[readonly]{background:var(--sunk);color:var(--fg2)}
.ttl{display:flex;flex-wrap:wrap;align-items:center;column-gap:14px;row-gap:6px;min-height:40px}
.ttl h1{line-height:40px}
.ftag-all{border-color:transparent;background:transparent;font-weight:500;color:var(--fg2);padding:0;font-size:14px}
.plink{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 9px;border:1px solid var(--line2);border-radius:7px;background:var(--surface);font-size:13px;color:var(--fg);text-align:left}
.plink .pid{color:var(--fg2)}
.plink:hover{background:var(--sunk);border-color:var(--fg3)}
.whint{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--infobg);color:var(--fg);border:1px solid color-mix(in srgb,var(--info) 30%,transparent)}
.artrow{display:flex;flex-wrap:wrap;gap:10px 12px;padding:14px 16px;border-top:1px solid var(--line)}
.setrow{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;padding:16px 18px;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setl{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:4px}
.setc{flex:0 1 auto;min-width:0}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swatch[aria-checked="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--surface) inset}
.swatch:disabled{opacity:.25;cursor:not-allowed}
/* Tour */
.tspot{position:fixed;z-index:70;border-radius:14px;box-shadow:0 0 0 4px var(--accent),0 0 0 9999px var(--scrim);pointer-events:none;transition:all .2s ease}
.tblock{position:fixed;inset:0;z-index:69}
.tpop{position:fixed;z-index:71;width:min(340px,calc(100vw - 32px));background:var(--surface);color:var(--fg);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.28);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tpop h2{font-size:17px}
.tdots{display:flex;gap:4px}.tdots span{width:6px;height:6px;border-radius:50%;background:var(--line2)}.tdots span.on{background:var(--fg);width:16px;border-radius:3px}
.twel{position:fixed;inset:0;z-index:71;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px}
.twel>section{width:min(460px,100%);background:var(--surface);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
@media (prefers-reduced-motion: reduce){.tspot{transition:none}}
/* Prototypleiste */
.pbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--pbar);border-bottom:1px solid var(--line);font-size:13px}
.pbar .tag{font-weight:600}
.pbar .sp{flex:1}
.pbar .btn{min-height:34px;font-size:13px;padding:0 11px}

/* App-Rahmen */
.shell{display:flex;min-height:calc(100% - 51px)}
.side{width:236px;flex-shrink:0;position:sticky;top:var(--pbh,51px);align-self:flex-start;height:calc(100vh - var(--pbh,51px));overflow-y:auto;padding:18px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;font-weight:600}
.logo{width:28px;height:28px;border-radius:8px;background:var(--primary);color:var(--on);display:flex;align-items:center;justify-content:center}
.nav{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border-radius:9px;border:0;background:transparent;width:100%;text-align:left;font-weight:500;color:var(--fg2)}
.nav:hover{background:var(--sunk);color:var(--fg)}
.nav[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px var(--line)}
.nav .n{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--fg3)}
.nav .n.bad{color:var(--bad)}
.side .grp{display:flex;flex-direction:column;gap:3px;padding-top:12px;border-top:1px solid var(--line)}
.side .foot{margin-top:auto;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:12px;color:var(--fg3)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.main{flex:1;min-width:0;padding:26px 32px 110px;display:flex;flex-direction:column;gap:20px}
.mtop,.fab{display:none}

/* Woche: Fokuskopf */
.whead{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.steps{flex:1 1 360px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--fg3)}
.steps .sd{width:23px;height:23px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.steps li.done .sd{background:var(--primary);border-color:var(--primary);color:var(--on)}
.steps li.cur{color:var(--fg);font-weight:600}
.steps li.cur .sd{border-color:var(--fg);box-shadow:0 0 0 3px var(--line)}
.steps .bar{flex:1;min-width:14px;height:2px;background:var(--line)}
.steps .bar.done{background:var(--primary)}
.wbody{display:flex;flex-wrap:wrap;flex:1;min-height:0}
.wmain{flex:999 1 520px;min-width:0;padding:24px 28px 120px;display:flex;flex-direction:column;gap:16px}
.wside{flex:1 1 320px;min-width:0;padding:24px 22px;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.wfoot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding-top:6px}

/* Lage */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left}
.kpi .k{font-size:13px;font-weight:600}
.kpi .v{font-size:40px;line-height:44px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--fg2)}
.two{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.two>.l{flex:2 1 480px;min-width:0;display:flex;flex-direction:column;gap:20px}
.two>.r{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:20px}
.wcta{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:20px 22px;border-radius:16px;background:var(--primary);color:var(--on)}
[data-theme="dark"] .wcta{background:var(--sunk);color:var(--fg);border:1px solid var(--line2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wcta{background:var(--sunk);color:var(--fg);border:1px solid var(--line2)}}
.wcta .t{font-size:21px;font-weight:600}
.wcta .pills{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.wcta .pills span{padding:4px 10px;border-radius:999px;background:color-mix(in srgb,currentColor 14%,transparent)}
.wcta .btn{background:var(--on);color:var(--primary);border-color:var(--on);font-weight:600}
[data-theme="dark"] .wcta .btn{background:var(--primary);color:var(--on);border-color:var(--primary)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wcta .btn{background:var(--primary);color:var(--on);border-color:var(--primary)}}
.feed{overflow:hidden}
.feed .day{padding:14px 16px 4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 16px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.row:hover{background:var(--surface2)}
.row .tx{flex:1;min-width:0}
.ri{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--sunk);color:var(--fg2)}
.ri.bad{background:var(--badbg);color:var(--bad)}.ri.warn{background:var(--warnbg);color:var(--warn)}.ri.act{background:var(--primary);color:var(--on)}
.strip{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px;align-items:end}
.strip span{height:8px;border-radius:4px;background:var(--sunk)}
.strip span.on{height:26px}

/* Nachhalten */
.wait{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.wait.cur{border:2px solid var(--fg)}
.wait .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--fg2)}
.age{display:inline-flex;width:110px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;vertical-align:middle}
.age i{display:block;height:100%}
.wait.decided{flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px}
.tick{width:22px;height:22px;border-radius:50%;background:var(--ok);color:var(--on);display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* Timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{border-top:1px solid var(--line)}
.tlb{display:flex;gap:14px;align-items:flex-start;width:100%;padding:12px 8px;margin:0 -8px;border:0;border-radius:10px;background:transparent;text-align:left;color:var(--fg)}
.tlb>.ico{align-self:center;color:var(--fg3)}
.tlb:hover{background:var(--sunk)}
.tl li:first-child{border-top:0}
.mk{width:20px;display:flex;justify-content:center;padding-top:4px;flex-shrink:0}
.m-fact{width:12px;height:12px;border-radius:50%;border:2px solid var(--fg3)}
.m-act{width:12px;height:12px;border-radius:50%;background:var(--fg)}
.m-bad{width:12px;height:12px;border-radius:50%;background:var(--bad)}
.m-judge{width:11px;height:11px;background:var(--judge);transform:rotate(45deg)}
.m-plan{width:12px;height:12px;border-radius:50%;border:2px dashed var(--accent)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.fact{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.fact .fl{font-size:12px;color:var(--fg2);font-weight:500}
.fact .fv{font-size:15px;font-weight:600}
.fact.next{background:var(--primary);border-color:var(--primary);color:var(--on)}
.fact.next .fl{color:inherit;opacity:.7}

/* Entscheiden */
.opt{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.opt[aria-checked="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center}
.opt[aria-checked="true"] .radio{border-color:var(--fg)}
.opt[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--fg)}
.q{display:flex;align-items:center;gap:9px;width:100%;min-height:42px;padding:6px 10px;border-radius:10px;border:0;background:transparent;font-size:13px;color:var(--fg2);text-align:left}
.q:hover{background:var(--sunk)}
.q[aria-current="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 0 0 1.5px var(--fg)}
.q.urg{background:var(--badbg)}
.q .n{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.q.done .n{background:var(--ok);border-color:var(--ok);color:var(--on)}
.budget{display:flex;gap:3px}
.budget span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.budget span.on{background:var(--fg)}
.budget span.u{background:var(--bad)}
.follow{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;border:1px solid var(--line);font-size:14px}
.ph{background:var(--warnbg);color:var(--warnfg);border-radius:4px;padding:0 3px;font-weight:600}

/* Post */
.post{display:flex;flex-wrap:wrap;gap:24px;min-height:0;align-items:flex-start}
.plist{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:6px}
.peditor{flex:2 1 460px;min-width:0;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;flex-direction:column;gap:5px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.msg[aria-current="true"]{border:2px solid var(--fg)}
.letter{padding:16px 18px;font-size:15px;line-height:1.6;white-space:pre-wrap;min-height:220px;border:0;width:100%;background:transparent;resize:vertical}
.tabs{display:flex;gap:4px;padding:8px 8px 0;background:var(--surface2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{min-height:38px;padding:0 14px;border:0;border-radius:8px 8px 0 0;background:transparent;font-size:13px;font-weight:500;color:var(--fg2);display:inline-flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.sendbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;background:var(--sunk)}

/* Overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;justify-content:flex-end}
.sheet{width:min(460px,100%);height:100%;background:var(--surface);overflow:auto;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:16px 12px 10px 20px;border-bottom:1px solid var(--line)}
.sheet .sb{padding:18px 20px;display:flex;flex-direction:column;gap:16px;flex:1}
.sheet .sf{padding:14px 20px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg)}
.iconbtn:hover{background:var(--sunk)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:60;background:var(--primary);color:var(--on);padding:10px 16px;border-radius:10px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.tasks{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:14px;background:var(--infobg);color:var(--fg)}
.tasks ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

function counts(){
 const inboxOpen=S.inbox.filter(i=>!i.done||i.done==='later').length;
 const urgentOpen=S.decisions.filter(d=>d.urgent&&!d.done).length;
 const waiting=S.waits.filter(w=>w.ans!=='in').length;
 const reg=S.decisions.filter(d=>!d.urgent);
 const msgsOpen=Object.keys(msgList()).filter(k=>!S.msgs[k]||!S.msgs[k].sent).length;
 return {inboxOpen,urgentOpen,waiting,reg:reg.length,regOpen:reg.filter(d=>!d.done).length,msgsOpen};
}
function mins(){ if(!S.week.start) return S.week.mins; return S.week.mins+Math.max(0,Math.round((Date.now()-S.week.start)/60000)); }

function noteOr(d,ph){ return d.note.trim()? esc(d.note.trim()) : '<span class="ph">['+ph+']</span>'; }
function addPara(rec,pid,src,de,en){
 S.paras=S.paras.filter(p=>p.src!==src);
 S.paras.push({rec,pid,src,de,en});
 if(S.msgs[rec]&&!S.msgs[rec].sent){S.msgs[rec].ok={};S.msgs[rec].edit={};}
}
function dropParas(src){ S.paras=S.paras.filter(p=>p.src!==src); }
function addTask(src,c,t,due,pid){ S.tasks=S.tasks.filter(x=>x.src!==src); S.tasks.push({id:'t'+(S.tasks.length+1),src,c,t,due,st:'offen',from:pid}); }

function msgList(){
 const out={};
 S.paras.forEach(p=>{(out[p.rec]=out[p.rec]||[]).push(p);});
 return out;
}
function msgText(rec,lang){
 const m=S.msgs[rec]; if(m&&m.edit&&m.edit[lang]!=null) return m.edit[lang];
 const r=REC[rec]; const ps=(msgList()[rec]||[]);
 const body=ps.map(p=>lang==='EN'?(p.en||''):p.de).filter(Boolean).join('\n\n');
 const tmp=document.createElement('div'); tmp.innerHTML=body;
 return (lang==='EN'?r.anredeEN:r.anrede)+'\n\n'+tmp.textContent+'\n\n'+(lang==='EN'?S.me.sigEN:S.me.sigDE);
}
function placeholders(t){ return (t.match(/\[[^\]]+\]/g)||[]).length; }
function ensureMsg(rec){ if(!S.msgs[rec]) S.msgs[rec]={ok:{},edit:{},sent:false}; return S.msgs[rec]; }

function hintSeen(n){ if(S.hintsOff) return true; if(S.hintSeen&&S.hintSeen[n]) return true; try{ return !!localStorage.getItem('wm-wh-'+n); }catch(e){ return false; } }

 let body=[null,wEingang,wNach,wEnt,wSend,wUeber][st]();
 const hint=weekHint(st); if(hint){ const m=body.match(/^<div class="wmain"[^>]*>/); if(m) body=m[0]+hint+body.slice(m[0].length); }

function followList(d){

 if(/Mail an Fr\. Berger/.test(f)) items.push(['mail','Entwurf an Fr. Berger','Postausgang · AW']);

 if(/Info DE\/EN an Eigentümer AW|Eigentümer-Info/.test(f)) items.push(['users','Eigentümer-Info','DE + EN · AW']);
 if(/Eigentümer TG/.test(f)) items.push(['users','Info Stellplatzeigentümer','DE + EN · TG']);
 if(/Aufgabe/.test(f)) items.push(['task','Aufgabe für dich',(f.split('·')[1]||'').trim()]);
 if(/Wiedervorlage/.test(f)) items.push(['clock','Wiedervorlage',f.replace('Wiedervorlage','').trim()]);

 return items.map(i=>'<div class="follow"><span class="ri">'+ic(i[0])+'</span><span style="display:flex;flex-direction:column;gap:2px"><b style="font-weight:600">'+i[1]+'</b><span class="muted" style="font-size:12px">'+i[2]+'</span></span></div>').join('');
}

function tourTarget(t){ return Array.from(document.querySelectorAll('[data-tour="'+t+'"]')).find(el=>el.offsetParent!==null||getComputedStyle(el).position==='fixed'); }
function tourHtml(){
 if(S.tour==null) return '';
 if(S.tour===-1) return '<div class="twel" role="dialog" aria-modal="true" aria-labelledby="twH"><section><span class="logo" style="width:40px;height:40px;border-radius:11px">'+ic('home',20)+'</span><h2 id="twH" style="font-size:22px">Willkommen im WEG Manager</h2><p class="muted">In 7 kurzen Schritten durch die wichtigsten Bereiche. Dauer etwa eine Minute.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" type="button" data-act="tourNext">Tour starten'+ic('right')+'</button><button class="btn ghost" type="button" data-act="tourEnd">Überspringen</button></div></section></div>';
 const st=TOUR[S.tour];
 return '<div class="tblock" data-act="tourNoop"></div><div class="tspot" id="tSpot"></div><section class="tpop" id="tPop" role="dialog" aria-modal="true" aria-labelledby="tpH"><div style="display:flex;align-items:center;gap:8px"><div class="tdots" aria-hidden="true">'+TOUR.map((x,i)=>'<span class="'+(i===S.tour?'on':'')+'"></span>').join('')+'</div><span class="pid" style="margin-left:auto">'+(S.tour+1)+' / '+TOUR.length+'</span><button class="iconbtn" style="width:36px;height:36px" type="button" data-act="tourEnd" aria-label="Tour beenden">'+ic('x',16)+'</button></div><h2 id="tpH" tabindex="-1">'+st.h+'</h2><p style="font-size:14px;line-height:1.5">'+st.b+'</p><div style="display:flex;gap:8px;justify-content:flex-end">'+(S.tour>0?'<button class="btn sm ghost" type="button" data-act="tourPrev">Zurück</button>':'')+'<button class="btn sm pri" type="button" data-act="tourNext">'+(S.tour===TOUR.length-1?'Fertig':'Weiter')+'</button></div></section>';
}
function placeTour(scroll){
 if(S.tour==null||S.tour<0) return;
 const el=tourTarget(TOUR[S.tour].t); const sp=document.getElementById('tSpot'), pop=document.getElementById('tPop'); if(!sp||!pop) return;
 if(!el){ sp.style.display='none'; pop.style.left='50%'; pop.style.top='50%'; pop.style.transform='translate(-50%,-50%)'; return; }
 if(scroll&&getComputedStyle(el).position!=='fixed') el.scrollIntoView({block:'center',behavior:'instant'});
 const r=el.getBoundingClientRect(), pad=6, W=innerWidth, H=innerHeight;
 Object.assign(sp.style,{display:'block',left:(r.left-pad)+'px',top:(r.top-pad)+'px',width:(r.width+2*pad)+'px',height:(r.height+2*pad)+'px'});
 const pw=pop.offsetWidth, ph=pop.offsetHeight, g=16; let x,y;
 if(W>=860&&r.right+g+pw<W-8){ x=r.right+g; y=Math.min(Math.max(8,r.top),H-ph-8); }
 else if(r.bottom+g+ph<H-8){ y=r.bottom+g; x=Math.min(Math.max(16,r.left),W-pw-16); }
 else { y=Math.max(8,r.top-g-ph); x=Math.min(Math.max(16,r.left),W-pw-16); }
 Object.assign(pop.style,{left:x+'px',top:y+'px',transform:'none'});
}
addEventListener('resize',()=>placeTour(false)); addEventListener('scroll',()=>placeTour(false),{passive:true});

  S.sheet=null; toast('Gespeichert'); },
tourStart(){ S.sheet=null; S.route='lage'; if(S.week.started&&!S.week.done){ S.week.mins=mins(); S.week.start=null; } S.showTasks=false; S.tour=-1; window.scrollTo(0,0); },
 tourNext(){ if(S.tour===-1){ S.route='lage'; } S.tour=S.tour+1; S.tourFocus=true; if(S.tour>=TOUR.length){ S.tour=null; try{localStorage.setItem('wm-tour','1');}catch(e){} S.showTasks=true; toast('Tour beendet · neu starten in Einstellungen › Hilfe'); window.scrollTo(0,0); } },
 tourPrev(){ S.tour=Math.max(0,S.tour-1); S.tourFocus=true; },
 tourEnd(){ S.tour=null; try{localStorage.setItem('wm-tour','1');}catch(e){} S.showTasks=true; window.scrollTo(0,0); },
 tourNoop(){},
 hintOk(d){ S.hintSeen=S.hintSeen||{}; S.hintSeen[d.n]=1; try{localStorage.setItem('wm-wh-'+d.n,'1');}catch(e){} },
 hintsOff(){ S.hintsOff=true; try{[1,2,3,4,5].forEach(n=>localStorage.setItem('wm-wh-'+n,'1'));}catch(e){} toast('Hinweise aus · wieder einschalten in Einstellungen › Hilfe'); },
 hintsReset(){ S.hintsOff=false; S.hintSeen={}; try{[1,2,3,4,5].forEach(n=>localStorage.removeItem('wm-wh-'+n));}catch(e){} toast('Hinweise zur Wochenarbeit wieder an'); },
 inSel(d){ const i=S.inbox.find(x=>x.id===d.id); if(!i) return; if((i.done==='assign'||i.done==='neu')&&i.sug){ return A.akte({id:i.sug}); } if(i.done){ i.done=null; } S.inSel=i.id; window.scrollTo(0,0); },
 inTset(d){ const it=curIn(); if(it) it.useT=d.v==='1'; },
 judgeSet(d){ const p=P(d.id); if(!!p.judged!==(d.v==='1')) A.judgeToggle(d); },
 evOpen(d){ S.sheet={type:'ev',p:d.p,i:+d.i}; },
 judgeToggle(d){ const p=P(d.id); p.judged=!p.judged; if(p.judged) p.ev.push({d:'16.11.',k:'judge',t:'<b>Du</b> bewertest: Zusage <b>nicht eingehalten</b>',src:'intern'}); else p.ev=p.ev.filter(e=>e.k!=='judge'); },
 seg(d){ S.seg=d.s; },
 tasks(){ S.sheet={type:'tasks'}; }, hideTasks(){ S.showTasks=false; },
 theme(){ const r=document.documentElement; const dark=r.dataset.theme? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme=dark?'light':'dark'; },
 reset(){ seed(); S.showTasks=true; toast('Neu gestartet'); },
 close(){ const sh=S.sheet; S.sheet=sh&&sh.back?sh.back:(sh&&sh.ret?{type:'kdetail',id:sh.ret}:null); }, scrim(d,el,ev){ if(ev.target===el) S.sheet=null; }
};
const AC={ /* change */
 filter(el){ S.filter=el.value; }, inT(el){ curIn().useT=el.checked; },
 judge(el){ A.judgeToggle({id:el.dataset.id}); },
 gArtSel(el){ S.sheet.f.art=el.value; },
 gVerw(el){ S.sheet.f.verw=el.value; },
 kfRole(el){ const r=S.sheet.f.roles.find(x=>x.c===el.dataset.c); if(r) r.r=el.value; },
 nhC(el){ S.nh.c[+el.dataset.i]=el.value; }, nhP(el){ const i=+el.dataset.i; if(el.value.indexOf('c:')===0){ S.nh.p[i]=''; S.nh.c[i]=el.value.slice(2); return; } S.nh.p[i]=el.value; if(el.value){ S.nh.c[i]=P(el.value).c; if(!S.nh.s[i].trim()) S.nh.s[i]=P(el.value).title; } }, fNoT(el){ S.sheet.f.noT=el.checked; if(el.checked) S.sheet.f.bis=''; }, fPt(el){ S.sheet.f.pt=el.value; },
 fFile(el){ const f=S.sheet.f; f.files=f.files||[]; Array.from(el.files||[]).forEach(fl=>{ if(f.files.some(x=>x.name===fl.name)) return; const kb=fl.size/1024; f.files.push({name:fl.name,size:kb>1024?(kb/1024).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(kb))+' KB'}); }); el.value=''; f.src='Datei'; }
};
const AI={ /* input, ohne Neurendern wo möglich */
 cq(el){ S.cq=el.value; return true; },
 note(el){ const c=S.decisions[S.week.decIdx]; c.note=el.value; if(c.done) applyDecision(c); return false; },
 nhS(el){ S.nh.s[+el.dataset.i]=el.value; return false; }, nhN(el){ S.nh.note=el.value; return false; }, nhX(el){ S.nh.extra=+el.value||0; return false; },
 msgEdit(el){ const m=ensureMsg(S.postSel); m.edit[S.lang]=el.value; const wasOk=Object.keys(m.ok).length; m.ok={}; return wasOk>0; },
 fWho(el){ const f=S.sheet.f; const st=x=>x.trim()&&!S.contacts.some(k=>k.name.toLowerCase()===x.trim().toLowerCase()); const a=st(f.who||''); f.who=el.value; return a!==st(el.value); }, fWas(el){ const was=!!S.sheet.f.was.trim(); S.sheet.f.was=el.value; return was!==!!el.value.trim(); }, fBis(el){ S.sheet.f.bis=el.value; return false; },
 sDate(el){ S.sheet.date=el.value; return false; },
 kq(el){ S.kq=el.value; return true; },
 artN(el){ const a=S.arten.find(x=>x.id===el.dataset.id); if(a) a.n=el.value; return false; }, artU(el){ const a=S.arten.find(x=>x.id===el.dataset.id); if(a) a.u=el.value; return false; },
 meName(el){ S.me.name=el.value; return false; }, meRole(el){ S.me.role=el.value; return false; }, meSigDE(el){ S.me.sigDE=el.value; return false; }, meSigEN(el){ S.me.sigEN=el.value; return false; },
 rMins(el){ S.rhythm.mins=+el.value||0; return false; }, rBudget(el){ S.rhythm.budget=+el.value||0; return false; }, rAkut(el){ S.rhythm.akut=+el.value||0; return false; },
 fo_punkte(el){ S.folders.punkte=el.value; return false; }, fo_quellen(el){ S.folders.quellen=el.value; return false; }, fo_kontakte(el){ S.folders.kontakte=el.value; return false; }, fo_vorlagen(el){ S.folders.vorlagen=el.value; return false; },
 gName(el){ const a=!!S.sheet.f.name.trim(); S.sheet.f.name=el.value; return a!==!!el.value.trim(); }, gShort(el){ S.sheet.f.short=el.value; return false; },
 gKey(el){ const v=el.value.toUpperCase().replace(/[^A-Z0-9]/g,''); const a=S.sheet.f.key; S.sheet.f.key=v; el.value=v; return /^[A-Z0-9]{2,3}$/.test(a)!==/^[A-Z0-9]{2,3}$/.test(v); },
 gAddr(el){ S.sheet.f.addr=el.value; return false; }, gUnits(el){ S.sheet.f.units=el.value; return false; },
 kfName(el){ const f=S.sheet.f; const before=kDupKey(f); f.name=el.value; return before!==kDupKey(f)||(f.tried&&!!el.value.trim()!==!!before.split('|')[0]); },
 kfOrg(el){ const f=S.sheet.f; const o=S.contacts.some(k=>k.kind==='org'&&k.name.toLowerCase()===f.org.trim().toLowerCase()); const was=!!f.org.trim()&&!o; f.org=el.value; const o2=S.contacts.some(k=>k.kind==='org'&&k.name.toLowerCase()===el.value.trim().toLowerCase()); return was!==(!!el.value.trim()&&!o2); }, kfMail(el){ S.sheet.f.mail=el.value; return false; }, kfTel(el){ S.sheet.f.tel=el.value; return false; }, kfNote(el){ S.sheet.f.note=el.value; return false; },
 kfCh(el){ S.sheet.f.ch=el.value; return false; }, kfStand(el){ S.sheet.f.stand=el.value; return false; },
 kfCount(el){ const a=+S.sheet.f.count>0; S.sheet.f.count=el.value; return a!==(+el.value>0); },
 kfR(el){ const r=S.sheet.f.roles[+el.dataset.i]; const a=!!r.r.trim(); r.r=el.value; return a!==!!el.value.trim(); }
};
document.addEventListener('click',ev=>{
 const el=ev.target.closest('[data-act]'); if(!el||el.disabled) return;
 const k=el.dataset.act; if(!A[k]) return;
 if(k==='scrim'&&ev.target!==el) return;
 const r=A[k](el.dataset,el,ev);
 if(r&&r.then) return;
 render();
});
document.addEventListener('change',ev=>{ const el=ev.target.closest('[data-act-change]'); if(!el) return; AC[el.dataset.actChange](el); render(); });
document.addEventListener('input',ev=>{ const el=ev.target.closest('[data-act-input]'); if(!el) return; if(AI[el.dataset.actInput](el)) render(); });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&S.tour!=null){ A.tourEnd(); render(); return; } if(S.tour!=null&&S.tour>=0&&(ev.key==='ArrowRight'||ev.key==='ArrowLeft')){ (ev.key==='ArrowRight'?A.tourNext:A.tourPrev)(); render(); return; } if(ev.key==='Escape'&&S.sheet){ S.sheet=null; render(); } });
function fromHash(){ const h=location.hash.replace('#',''); if(['lage','punkte','post','kontakte','einst'].indexOf(h)>=0) S.route=h; else if(h==='woche'){ S.route='woche'; if(!S.week.started){S.week.started=true;S.week.start=Date.now();} } }
window.addEventListener('hashchange',()=>{fromHash();render();});
seed(); fromHash(); try{ if(!localStorage.getItem('wm-tour')){ S.tour=-1; S.showTasks=false; S.route='lage'; } }catch(e){} render();
setInterval(()=>{ if(S.route==='woche'&&S.week.start){ const el=document.querySelector('.whead .pid'); if(el) el.textContent='aktiv '+mins()+' min · Ziel ≤ 60'; } },20000);
})();
</script>
