# Quality gate on every push to main and every pull request. The logic lives in npm scripts;
# this file only orchestrates them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only a pull request's older run is stale. Two merges to main in a row must each finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            reports/junit.xml
            reports/coverage/cobertura-coverage.xml
          if-no-files-found: ignore
      - name: Upload plugin build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: dist/

  # Approximates the community directory's source scan (docs/engineering/testing.md). Informational:
  # findings are visible in the log but never fail the workflow (owner's decision, 2026-11-21).
  scanner-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Step-level continue-on-error keeps the job (and the PR check) green; the annotation
      # below and the step log show the findings.
      - id: scan
        run: npm run lint:scanner
        continue-on-error: true
      - if: steps.scan.outcome == 'failure'
        run: echo "::warning title=Scanner lint::Findings in the community-scan approximation (known - .claude/skills/archify/explainer/reader.js). See the 'npm run lint:scanner' step log and docs/engineering/testing.md."

  # End-to-end tests in a real Obsidian app (wdio-obsidian-service). Runs beside verify and is
  # not part of the fast gate. The downloaded Obsidian stays in the Actions cache only: it is
  # never uploaded as an artifact (Obsidian's terms forbid redistribution).
  # Latest Obsidian app on the latest installer only (owner's decision, 2026-11-21).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Resolve Obsidian versions for the cache key
        run: |
          node tests/e2e/wdio.conf.mts | grep 'obsidian-cache-key:' > obsidian-versions-lock.txt
          cat obsidian-versions-lock.txt
          rm -rf .obsidian-cache
      - name: Cache Obsidian
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ runner.os }}-${{ hashFiles('obsidian-versions-lock.txt') }}
      - name: Start a virtual display and window manager
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y herbstluftwm
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1280x1024x24 +extension GLX -noreset &
          sleep 1
          DISPLAY=:99 herbstluftwm &
          sleep 1
      - run: npm run test:e2e
        env:
          WDIO_MAX_INSTANCES: 2
      - name: Upload e2e logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: reports/e2e/
          if-no-files-found: ignore
