# Dependabot version updates (PBI-58). The repo pins exact versions, and Dependabot
# keeps them exact. Majors are not grouped, so each one gets its own pull request.
#
# `overrides` in package.json (ADR 0001, "Security overrides") are not touched by
# Dependabot. Remove an override by hand once upstream requires the patched
# version itself (check with `npm ls <pkg>` after an update).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
    # Majors that other tools block (ADR 0001, "Fallbacks and their blockers"). Remove an entry when its
    # blocker is gone, then let Dependabot propose the major again.
    ignore:
      # typescript-eslint 8 accepts only typescript <6.1.0.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # eslint-plugin-obsidianmd's dependencies accept only ESLint ^9.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [minor, patch]
