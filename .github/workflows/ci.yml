# Quality gate on every push to main and every pull request. The logic lives in npm scripts;
# this file only orchestrates (blueprint Task 11, GitHub Actions per the Task 11 decision).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            reports/junit.xml
            reports/coverage/cobertura-coverage.xml
          if-no-files-found: ignore
      - name: Upload plugin build
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: dist/

  # End-to-end tests in a real Obsidian app (wdio-obsidian-service). Runs beside verify and is
  # not part of the fast gate. The downloaded Obsidian stays in the Actions cache only: it is
  # never uploaded as an artifact (Obsidian's terms forbid redistribution).
  # Latest Obsidian app on the latest installer only (owner's decision, 2026-11-21).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Resolve Obsidian versions for the cache key
        run: |
          node tests/e2e/wdio.conf.mts | grep 'obsidian-cache-key:' > obsidian-versions-lock.txt
          cat obsidian-versions-lock.txt
          rm -rf .obsidian-cache
      - name: Cache Obsidian
        uses: actions/cache@v4
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ runner.os }}-${{ hashFiles('obsidian-versions-lock.txt') }}
      - name: Start a virtual display and window manager
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y herbstluftwm
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1280x1024x24 +extension GLX -noreset &
          sleep 1
          DISPLAY=:99 herbstluftwm &
          sleep 1
      - run: npm run test:e2e
        env:
          WDIO_MAX_INSTANCES: 2
      - name: Upload e2e logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: reports/e2e/
          if-no-files-found: ignore
