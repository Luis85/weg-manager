# Release on a bare semver tag (no "v"): gate, stage, then a GitHub release carrying exactly
# main.js, manifest.json and styles.css, which is what Obsidian installs. The three assets get a
# signed build-provenance attestation, as the Obsidian developer docs recommend for submission
# ("Release your plugin with GitHub Actions").
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run release:package -- --tag "${{ github.ref_name }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weg-manager-${{ github.ref_name }}
          path: release/weg-manager/
      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/weg-manager/main.js
            release/weg-manager/manifest.json
            release/weg-manager/styles.css
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" --title "$TAG" --generate-notes
          release/weg-manager/main.js release/weg-manager/manifest.json release/weg-manager/styles.css
